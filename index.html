<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DCI Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #150f24;
    --bg2: #1f1533;
    --text: #f4ecff;
    --muted: #b7a9d9;
    --accent: #ff7a1a;
    --accent-dark: #e8640a;
    --purple: #7b2ff7;
    --card-bg: #211636;
    --card-border: #3a2a5c;
    --label-bg: #2a1d45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(ellipse 700px 400px at 20% -5%, rgba(255,122,26,0.18), transparent 60%),
      radial-gradient(ellipse 600px 400px at 85% 10%, rgba(123,47,247,0.22), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .bat {
    position: fixed;
    top: -40px;
    font-size: 1.6rem;
    opacity: 0.55;
    animation: drift linear infinite;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
  }
  @keyframes drift {
    0%   { transform: translate(0, -10vh) rotate(-6deg); }
    50%  { transform: translate(-6vw, 55vh) rotate(6deg); }
    100% { transform: translate(2vw, 115vh) rotate(-6deg); }
  }

  .topbar {
    background: linear-gradient(90deg, var(--accent), var(--purple));
    height: 6px;
    position: relative;
    z-index: 1;
  }
  header {
    padding: 36px 24px 20px;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  header h1 {
    font-family: 'Creepster', cursive;
    font-size: 3rem;
    font-weight: 400;
    margin: 0 0 6px;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,122,26,0.5), 0 0 4px rgba(255,122,26,0.8);
  }
  header h1 span { color: var(--accent); }
  header p.tagline {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }
  header .links {
    margin-top: 10px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  header .links a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    font-size: 0.9rem;
  }
  header .links a:hover { text-decoration: underline; }

  .pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 1100px;
    margin: 0 auto;
    padding: 4px 24px 28px;
    position: relative;
    z-index: 1;
  }
  .pill {
    background: var(--accent);
    color: #1a1026;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pill:hover { background: var(--accent-dark); }
  .pill:active { transform: scale(0.97); }
  .pill.inactive {
    background: var(--label-bg);
    color: var(--text);
  }
  .pill.inactive:hover { background: #352352; }

  .section-title {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 24px 0;
    position: relative;
    z-index: 1;
  }
  .section-title h2 {
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0 0 4px;
    display: inline-block;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    position: relative;
    z-index: 1;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    position: relative;
  }
  .card:hover {
    box-shadow: 0 6px 22px rgba(255,122,26,0.25);
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #2a1d45, #1a1130);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    position: relative;
  }
  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--accent);
    color: #1a1026;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.4px;
  }
  .card .label-strip {
    background: var(--label-bg);
    text-align: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    padding: 6px 0;
    letter-spacing: 0.3px;
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    text-transform: uppercase;
  }
  .card .info {
    padding: 10px 12px 14px;
  }
  .card h3 {
    margin: 0 0 2px;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.3;
  }
  .card .meta {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 24px;
    grid-column: 1 / -1;
  }

  .music-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 1000;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .music-toggle:hover { transform: scale(1.08); border-color: var(--accent); }
  .music-toggle.playing { border-color: var(--accent); box-shadow: 0 0 16px rgba(255,122,26,0.4); }
</style>
</head>
<body>

<span class="bat" style="left:8%; animation-duration:16s; animation-delay:0s;">🦇</span>
<span class="bat" style="left:35%; animation-duration:21s; animation-delay:3s; font-size:1.1rem;">🦇</span>
<span class="bat" style="left:62%; animation-duration:18s; animation-delay:7s;">🦇</span>
<span class="bat" style="left:85%; animation-duration:24s; animation-delay:1s; font-size:1.2rem;">🦇</span>

<div class="topbar"></div>

<header>
  <h1>🎃 DCI <span>Arcade</span></h1>
  <p class="tagline">Games built by students, for students.</p>
  <div class="links">
    <a href="my-stats.html">📊 My Stats</a>
    <a href="leaderboard.html">🏆 Leaderboards</a>
  </div>
</header>

<div class="pills" id="filter-pills">
  <button class="pill" data-type="subject" data-value="">All Games</button>
</div>

<div class="section-title">
  <h2 id="section-label">All Games</h2>
</div>

<div class="grid" id="game-grid">
  <p class="empty">Loading games…</p>
</div>

<audio id="bg-music" src="shared/halloween-theme.mp3" loop preload="none"></audio>
<button id="music-toggle" class="music-toggle" aria-label="Toggle background music" title="Play spooky music">🔇</button>

<script>
  const music = document.getElementById("bg-music");
  const musicBtn = document.getElementById("music-toggle");
  const MUSIC_PREF_KEY = "dci_arcade_music_on";

  function setMusicState(playing) {
    musicBtn.textContent = playing ? "🔊" : "🔇";
    musicBtn.classList.toggle("playing", playing);
    musicBtn.title = playing ? "Mute music" : "Play spooky music";
  }

  musicBtn.addEventListener("click", () => {
    if (music.paused) {
      music.volume = 0.35;
      music.play().then(() => {
        setMusicState(true);
        localStorage.setItem(MUSIC_PREF_KEY, "on");
      }).catch(err => console.error("Playback failed", err));
    } else {
      music.pause();
      setMusicState(false);
      localStorage.setItem(MUSIC_PREF_KEY, "off");
    }
  });

  // If the visitor had music on last time, try to resume automatically.
  // Browsers block this until they've interacted with the page at least
  // once this session, so it silently falls back to showing the muted
  // icon if that fails — no error, just waits for a click.
  if (localStorage.getItem(MUSIC_PREF_KEY) === "on") {
    music.volume = 0.35;
    music.play().then(() => setMusicState(true)).catch(() => setMusicState(false));
  }
</script>

<script>
  const grid = document.getElementById("game-grid");
  const pillsEl = document.getElementById("filter-pills");
  const sectionLabel = document.getElementById("section-label");

  let allGames = [];
  let activeSubject = "";

  function uniqueSorted(values) {
    return [...new Set(values.filter(Boolean))].sort();
  }

  function subjectIcon(subject) {
    const map = {
      "Math": "🔢",
      "Science": "🔬",
      "ELA": "📖",
      "Social Studies": "🌍",
      "Other": "✨"
    };
    return map[subject] || "🎮";
  }

  function buildPills() {
    const subjects = uniqueSorted(allGames.map(g => g.subject));
    pillsEl.innerHTML = `<button class="pill" data-value="">All Games</button>` +
      subjects.map(s => `<button class="pill inactive" data-value="${s}">${subjectIcon(s)} ${s}</button>`).join("");

    pillsEl.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        activeSubject = btn.dataset.value;
        pillsEl.querySelectorAll(".pill").forEach(b => {
          b.classList.toggle("inactive", b.dataset.value !== activeSubject);
        });
        sectionLabel.textContent = activeSubject ? activeSubject + " Games" : "All Games";
        render();
      });
    });
  }

  function render() {
    const filtered = allGames.filter(g => !activeSubject || g.subject === activeSubject);
    if (filtered.length === 0) {
      grid.innerHTML = `<p class="empty">No games here yet.</p>`;
      return;
    }
    grid.innerHTML = filtered.map(game => `
      <a class="card" href="games/${game.slug}/">
        <div class="thumb">
          ${game.badge ? `<span class="badge">${game.badge}</span>` : ""}
          ${game.thumbnail
            ? `<img src="${game.thumbnail}" alt="${game.title}" />`
            : subjectIcon(game.subject)}
        </div>
        <div class="label-strip">${game.subject || "Game"}</div>
        <div class="info">
          <h3>${game.title}</h3>
          <div class="meta">${game.grade ? "Grade " + game.grade : ""}</div>
        </div>
      </a>
    `).join("");
  }

  fetch("catalog/games.json")
    .then(res => res.json())
    .then(data => {
      allGames = data.filter(g => g.status === "live");
      buildPills();
      render();
    })
    .catch(err => {
      console.error("Failed to load catalog", err);
      grid.innerHTML = `<p class="empty">Couldn't load the game list. Try refreshing.</p>`;
    });
</script>

</body>
</html>
