<!DOCTYPE html>
<html>
<head><title>Test Game</title></head>
<body>
  <h1>Test Game</h1>
  <button id="play">Play</button>
  <p id="result"></p>

  <script type="module" src="../../shared/lab-sdk.js"></script>
  <script type="module">
    document.getElementById("play").addEventListener("click", async () => {
      const handle = await LabSDK.getHandle();
      const score = Math.floor(Math.random() * 100);
      await LabSDK.recordScore("test-game", score);
      document.getElementById("result").textContent =
        `${handle}, you scored ${score}!`;
    });
  </script>
</body>
</html>
