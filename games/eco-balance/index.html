<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoBalance: Ecosystem in Peril</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f2ec;--ink:#0f2f2d;--mut:#4d6b68;--card:#fbfefc;--line:#b9d1c6;--ok:#2f8f5b;--st:#d98a1f;--hu:#8a8f94;--bad:#b3392f;--acc:#0f5f58;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d1c;--ink:#e3f2ea;--mut:#8fb0a8;--card:#12302e;--line:#27504b;--ok:#5fcf93;--st:#f0b04a;--hu:#8a9a98;--bad:#ef7a6f;--acc:#5fcf93;--on:#08201d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:14px;max-width:1040px;margin:0 auto}body.t{padding-bottom:230px}body.g{padding-bottom:110px}
h1,h2,h3,.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,38px);margin:0;font-weight:800}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;justify-content:space-between;margin-bottom:12px}
.stats{display:flex;gap:16px;font-weight:600}.stats b{font-size:22px}
.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.ev{border:2px solid var(--acc);border-radius:14px;padding:10px 14px;margin-bottom:12px;background:var(--card)}
.ev h2{margin:0;font-size:20px}.ev p{margin:2px 0 0;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:8px;min-height:170px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile.hot{border-color:var(--acc);cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.tile h3{margin:0;font-size:15px}
.ic s{opacity:.8;color:var(--bad)}
.tok{display:inline-block;font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:99px;padding:0 6px;margin-right:3px}
.o{border-radius:8px;border:1.5px solid var(--ok);padding:4px 6px;font-size:13px;line-height:1.25;cursor:pointer}
.o.st{border-color:var(--st);border-style:dashed}.o.hu{border-color:var(--hu);border-style:dotted}
.o.mv{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.o small{display:block;color:var(--mut)}
.hand{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-top:6px}
.c{flex:0 0 150px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px;font:inherit;cursor:pointer}
.c.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.c b{display:block;font-size:14px}.c span{font-size:12px;color:var(--mut)}
.c:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button.go,button.ln{border-radius:99px;padding:10px 20px;font:700 15px inherit;font-family:inherit;cursor:pointer}
button.go{background:var(--acc);color:var(--on);border:0}
button.ln{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.ln.on{border-color:var(--acc)}button.ln:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--st);outline-offset:2px}
.log{color:var(--mut);font-size:14px;min-height:21px;margin:6px 0}
.key{font-size:13px;color:var(--mut);margin-top:10px}
.end,.menu{text-align:center;border:2px solid var(--acc);border-radius:16px;padding:24px;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.spot{outline:3px solid var(--st);outline-offset:3px;border-radius:12px}
.pipbox{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;max-width:min(430px,92vw);z-index:5;pointer-events:none}
.say{background:var(--card);border:2px solid var(--acc);border-radius:14px 14px 14px 2px;padding:7px 11px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(660px,95vw);background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.tut p{margin:0 0 8px}.tut .bt{display:flex;gap:8px;flex-wrap:wrap}.tut small{color:var(--mut)}
.pip{flex:none;animation:bob 2.6s ease-in-out infinite;pointer-events:auto;cursor:pointer}.pip.w{animation:wig .5s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@media(prefers-reduced-motion:reduce){.pip{animation:none!important}}
@media(max-width:760px){.board{grid-template-columns:1fr 1fr}.tile{min-height:140px}.tut{flex-direction:column;text-align:center}}
#v3{position:relative;width:100%;height:clamp(300px,58vh,560px);border-radius:16px;overflow:hidden;border:2px solid var(--line);touch-action:none;background:#cfe9f5;margin-bottom:6px}body.gl .board{display:none}.tip{position:absolute;pointer-events:none;display:none;background:var(--card);color:var(--ink);border:2px solid var(--acc);border-radius:10px;padding:3px 9px;font-size:13px;z-index:3;white-space:nowrap}.pop{position:absolute;left:50%;top:38%;margin-left:-60px;width:120px;text-align:center;font:800 44px "Bricolage Grotesque",system-ui,sans-serif;color:#fff;text-shadow:0 3px 0 #0f5f58,0 0 18px #0f5f58;pointer-events:none;z-index:3}
</style></head><body>
<div class="top"><div><h1>EcoBalance</h1><p class="sub">Build food chains. Keep every species supplied with sun, water and minerals.</p></div>
<div class="stats" id="stats"></div></div>
<div id="app"></div><div id="pipbox"></div><div id="tut"></div>
<script>
const IC={s:'☀️',w:'💧',m:'⛰️'},TK={d:{e:'🏜️',n:'Drought',neg:'w'},f:{e:'❄️',n:'Frost',neg:'s'},l:{e:'🪨',n:'Landslide',neg:'m'}};
const TL=['Producer','Herbivore','Carnivore'],PT=[1,2,3];
const DATA={
home:{n:'Home Valley',tiles:[['Meadow','s'],['Wetland','w'],['River','w'],['Ridge','ms'],['Forest','sw'],['Marsh','w'],['Savanna','s'],['Cliffside','m'],['Orchard','sw'],['Pond','w'],['Quarry','m'],['Dunes','s'],['Hot Spring','mw'],['Canyon','ms'],['Scrubland','s'],['Fen','mw']],
orgs:[['Prairie Grass','🌾',0,'s'],['Cattail','🌿',0,'w'],['Fern','🌱',0,'sw'],['Lichen','🍄',0,'m'],['Clover','☘️',0,'s'],['Reed','🎋',0,'w'],['Sunflower','🌻',0,'s'],['Alpine Herb','🌼',0,'m'],
['Rabbit','🐇',1,'s'],['Beaver','🦫',1,'w'],['Deer','🦌',1,'sw'],['Mountain Goat','🐐',1,'ms'],['Grasshopper','🦗',1,'s'],['Frog','🐸',1,'w'],['Tortoise','🐢',1,'sm'],['Squirrel','🐿️',1,'sw'],
['Hawk','🦅',2,'s'],['Heron','🪶',2,'w'],['Fox','🦊',2,'sw'],['Bobcat','🐈',2,'ms'],['Snake','🐍',2,'s'],['Otter','🦦',2,'w'],['Owl','🦉',2,'sw'],['Badger','🦡',2,'m']]},
tundra:{n:'Tundra',tiles:[['Glacier','m'],['Ice Lake','w'],['Taiga','sw'],['Permafrost','mw'],['Snowfield','s'],['Moraine','ms'],['Fjord','w'],['Lichen Flats','m']],
orgs:[['Moss','🟢',0,'w'],['Arctic Willow','🌳',0,'sw'],['Cotton Grass','🌾',0,'s'],['Rock Lichen','🍄',0,'m'],['Arctic Hare','🐇',1,'s'],['Musk Ox','🐂',1,'sw'],['Lemming','🐹',1,'w'],['Ibex','🐐',1,'m'],['Snowy Owl','🦉',2,'s'],['Arctic Fox','🦊',2,'sw'],['Wolf','🐺',2,'m'],['Seal','🦭',2,'w']]},
reef:{n:'Coral Reef',tiles:[['Coral Terrace','sw'],['Lagoon','w'],['Seagrass Bed','sw'],['Reef Wall','m'],['Sandbar','s'],['Kelp Forest','sw'],['Trench','mw'],['Tide Pool','w']],
orgs:[['Sea Grass','🌱',0,'sw'],['Kelp','🌿',0,'w'],['Algae','🟩',0,'s'],['Coral','🪸',0,'m'],['Parrotfish','🐠',1,'s'],['Sea Turtle','🐢',1,'w'],['Urchin','🦔',1,'m'],['Manatee','🦭',1,'sw'],['Reef Shark','🦈',2,'w'],['Barracuda','🐟',2,'s'],['Octopus','🐙',2,'m'],['Moray','🐍',2,'sw']]}};
const UNL={tundra:100,reef:140};
const MIT=[{n:'Irrigation Ditch',e:'🚰',rm:'d'},{n:'Shade Structure',e:'⛱️',rm:'d'},{n:'Frost Tent',e:'⛺',rm:'f'},{n:'Heat Lamp',e:'🔥',rm:'f'},{n:'Retaining Wall',e:'🧱',rm:'l'},{n:'Terrace',e:'🪜',rm:'l'}];
const EV=[{n:'Heatwave',t:'d',k:3},{n:'Dry Spell',t:'d',k:1},{n:'Drought Season',t:'d',k:2},{n:'Late Frost',t:'f',k:2},{n:'Cold Snap',t:'f',k:3},{n:'Landslide',t:'l',k:2},{n:'Rockfall',t:'l',k:1},
{n:'Gentle Rain',clear:1,d:'A calm season. All tokens are cleared.'},{n:'Mild Season',draw:1,d:'No hazards. You draw 1 extra card.'},{n:'Bumper Year',draw:2,d:'No hazards. You draw 2 extra cards.'}];
const R=8,AP0=3,CAP=3;
let G=null,T={on:false,step:0},idle=Date.now(),say=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
function pip(m,s=64,w){const mo=m=='sad'?'M38 60q12-9 24 0':m=='cheer'?'M38 54q12 17 24 0z':'M38 54q12 12 24 0';
return `<svg class="pip ${w?'w':''}" width="${s}" height="${s}" viewBox="0 0 100 90" aria-hidden="true"><g stroke="#e0527f" stroke-width="5" stroke-linecap="round"><path d="M22 34l-14-8M22 42l-16 0M22 50l-14 8M78 34l14-8M78 42l16 0M78 50l14 8"/></g><ellipse cx="50" cy="48" rx="32" ry="30" fill="#f7a8c0"/><circle cx="38" cy="40" r="5.5" fill="#1b1b1b"/><circle cx="62" cy="40" r="5.5" fill="#1b1b1b"/><circle cx="40" cy="38" r="1.8" fill="#fff"/><circle cx="64" cy="38" r="1.8" fill="#fff"/><circle cx="29" cy="52" r="4" fill="#ee7aa0" opacity=".6"/><circle cx="71" cy="52" r="4" fill="#ee7aa0" opacity=".6"/>${m=='sad'?'<path d="M31 30l13 5M69 30l-13 5" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>':''}<path d="${mo}" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" fill="${m=='cheer'?'#8a2a4a':'none'}"/></svg>`}
function talk(t,m='happy',w){say={t,m,w}}
function shuf(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function drawCard(){const r=Math.random();if(r<.7){const ty=Math.random()<.4?0:Math.random()<.58?1:2;const o=pick(DATA[G.biome].orgs.filter(x=>x[2]==ty));return{k:'o',n:o[0],e:o[1],t:o[2],a:o[3].split('')}}
 if(r<.96)return{k:'m',...pick(MIT)};return{k:'u',n:'Seed Bank',e:'🫘'}}
function pickTiles(D){const s=shuf(D.tiles).slice(0,8);const need=[...new Set(D.orgs.map(o=>o[3].split('').sort().join('')).filter(k=>k.length>1))];
 need.forEach(k=>{const has=t=>k.split('').every(x=>t[1].includes(x));if(!s.some(has)){const c=D.tiles.filter(has),i=s.findIndex(t=>t[1].length==1);if(c.length&&i>=0)s[i]=pick(c)}});
 return s.map(t=>({n:t[0],a:t[1].split(''),orgs:[],tok:[]}))}
function startGame(biome,tut){const D=DATA[biome];G={biome,r:0,ap:AP0,score:0,sel:null,mv:null,log:'',hist:[],tiles:pickTiles(D),hand:[],done:false};
 const o=D.orgs;[0,0,1,1,2].forEach(ty=>{const x=pick(o.filter(z=>z[2]==ty));G.hand.push({k:'o',n:x[0],e:x[1],t:x[2],a:x[3].split('')})});
 G.hand.push(drawCard(),drawCard());T={on:tut,step:0};startRound(true);
 talk(tut?'Hi, I’m Pip! Let’s go.':'Good luck! Keep those chains fed.','happy',1);document.body.className=tut?'t':'g';draw()}
function startRound(first){G.r++;G.ap=AP0;G.sel=null;G.mv=null;const e=pick(EV);G.ev={...e};const names=[];
 if(e.clear)G.tiles.forEach(t=>t.tok=[]);
 if(e.t){shuf(G.tiles.map((_,i)=>i)).slice(0,e.k).forEach(i=>{G.tiles[i].tok.push({k:e.t,ttl:2});names.push(G.tiles[i].n)});G.ev.d=TK[e.t].n+' tokens land on '+names.join(', ')+'. Species there that need '+IC[TK[e.t].neg]+' go into Stress Mode.'}
 if(!first)for(let i=0;i<2+(e.draw||0);i++)if(G.hand.length<9)G.hand.push(drawCard());
 G.log=first?'Pick a card, then pick a tile. Match the icons on the card to the tile.':'';
 if(!first)talk(e.t?'Uh oh, '+e.n+'! Check the tokens.':e.n+'. Nice and calm!',e.t?'sad':'happy',1)}
function avail(t){const neg=t.tok.map(k=>TK[k.k].neg);return t.a.filter(x=>!neg.includes(x))}
function evalBoard(){const all=[];G.tiles.forEach(t=>{const av=avail(t);t.orgs.forEach(o=>{o.st=o.a.every(x=>av.includes(x))?'ok':'st';all.push(o)})});
 const P=all.filter(o=>o.t==0&&o.st=='ok').length,hs=all.filter(o=>o.t==1&&o.st=='ok'),cs=all.filter(o=>o.t==2&&o.st=='ok');
 hs.forEach((o,i)=>{if(i>=P)o.st='hu'});const fh=hs.filter(o=>o.st=='ok').length;cs.forEach((o,i)=>{if(i>=fh)o.st='hu'});
 const sc=all.reduce((s,o)=>s+(o.st=='ok'?PT[o.t]:0),0),c=[0,1,2].map(t=>all.filter(o=>o.t==t&&o.st=='ok').length);
 return{sc,bal:c[0]>=c[1]&&c[1]>=c[2]&&c[2]>0,all}}
function place(i){const t=G.tiles[i];
 if(G.mv){const[a,b]=G.mv,o=G.tiles[a].orgs[b];if(a==i){G.mv=null;return}if(G.ap<1)return;if(t.orgs.length>=CAP){G.log='That tile is full.';return}
  G.tiles[a].orgs.splice(b,1);t.orgs.push(o);G.ap--;G.mv=null;G.log=o.n+' moved to '+t.n+'.';react(i,o);return}
 const c=G.hand[G.sel];if(!c||G.ap<1)return;
 if(c.k=='o'){if(t.orgs.length>=CAP){G.log='That tile is full (3 organisms).';return}t.orgs.push({n:c.n,e:c.e,t:c.t,a:c.a})}
 else{const j=t.tok.findIndex(k=>k.k==c.rm);if(j<0){G.log='No '+TK[c.rm].n+' token on '+t.n+'.';talk('That tile has no '+TK[c.rm].n+' token.','sad',1);return}t.tok.splice(j,1)}
 G.hand.splice(G.sel,1);G.sel=null;G.ap--;G.log=c.n+' played on '+t.n+'.';react(i,c)}
function react(i,c){const r=evalBoard(),o=G.tiles[i].orgs.find(x=>x.n==c.n);
 if(o&&o.st=='st')talk(o.n+' is stressed here. Try a tile with '+o.a.map(x=>IC[x]).join(' ')+'.','sad',1);
 else if(o&&o.st=='hu')talk(o.n+' is hungry. It needs food one level down.','sad',1);
 else if(o)talk(pick(['Thriving! 🎉','Nice placement!','That’s a happy '+o.n+'.']),'cheer');
 else talk('Fixed!','cheer')}
function endRound(){const r=evalBoard(),gain=r.sc+(r.bal?2:0);let lost=0;const dead=[];G.tiles.forEach(t=>{t.orgs=t.orgs.filter(o=>{if(o.st=='ok'){o.bad=0;return true}o.bad=(o.bad||0)+1;if(o.bad>=5){lost+=PT[o.t]*2;dead.push(o.n);return false}return true})});G.mv=null;G.score=Math.max(0,G.score+gain-lost);G.hist.push(gain-lost);
 G.tiles.forEach(t=>{t.tok.forEach(k=>k.ttl--);t.tok=t.tok.filter(k=>k.ttl>0)});
 if(G.r>=R){G.done=true;if(window.LabSDK){window.LabSDK.recordScore('eco-balance',G.score).catch(function(e){console.error('LabSDK scoring failed',e)})}const b=ld('eco_best',0);if(G.score>b)sv('eco_best',G.score);const u=ld('eco_unl',[]);G.newU=[];
  Object.keys(UNL).forEach(k=>{if(G.score>=UNL[k]&&!u.includes(k)){u.push(k);G.newU.push(k)}});sv('eco_unl',u);talk(G.newU.length?'A NEW BIOME! Look!':'Great work, keeper!','cheer',1);return}
 startRound();G.log='Round '+(G.r-1)+' scored '+gain+(r.bal?' (includes +2 balance bonus).':'.')+(lost?' Lost '+lost+' points: '+dead.join(', ')+' died after 5 rounds without thriving.':'');if(lost)talk(dead.join(', ')+' didn’t make it. Fix problems before 5 rounds pass!','sad',1);else{const w=G.tiles.flatMap(t=>t.orgs).filter(o=>o.bad>=3);if(w.length)talk(w[0].n+' has struggled '+w[0].bad+' rounds. Help it soon!','sad',1)}}
const STEPS=[['Hi, I’m Pip! I’ll show you how to keep an ecosystem balanced in about a minute.',''],
['These are your land tiles. Icons show what each provides: ☀️ sun, 💧 water, ⛰️ minerals. Each tile holds 3 organisms. Drag to turn the view.','#stage'],
['Tap a card, then tap a tile. Each organism lists the icons it needs. If the tile has them, it thrives (green).','.hand'],
['Build a chain: producers feed herbivores, herbivores feed carnivores, one to one. With no food, an animal is Hungry (grey) and scores nothing.','.bar'],
['Each round an event drops tokens on tiles. A crossed-out icon means that need is missing, so organisms needing it get stressed (orange).','.ev'],
['Fix cards cost 1 action and remove a token. You can also move an organism for 1 action: tap it, then tap another tile.','.hand'],
['You get 3 actions a round. Press End round to score. Organisms not thriving for 5 rounds in a row die and cost points. High scores unlock new biomes. Ready?','.bar']];
function endTut(){T.on=false;sv('eco_tut',1);document.body.className='g';draw()}
function menu(){document.body.className='';document.getElementById('pipbox').innerHTML='';document.getElementById('tut').innerHTML='';document.getElementById('stats').innerHTML='';
 const u=ld('eco_unl',[]),best=ld('eco_best',0),seen=ld('eco_tut',0);let sel=window.__b||'home';
 const bs=Object.keys(DATA).map(k=>{const lock=k!='home'&&!u.includes(k);return `<button class="ln ${k==sel?'on':''}" data-b="${k}" ${lock?'disabled':''}>${lock?'🔒 ':''}${DATA[k].n}${lock?' (score '+UNL[k]+')':''}</button>`}).join('');
 document.getElementById('app').innerHTML=`<div class="menu"><div style="display:flex;justify-content:center">${pip('happy',96,1)}</div><h2 class="d" style="font-size:28px;margin:6px 0">Ready to keep the balance?</h2><p class="sub">Best score: ${best}. Reach 100 to unlock Tundra, 140 for Coral Reef.</p><div class="row">${bs}</div><div class="row">${ld('eco_save',null)?'<button class="go" data-r="1">Continue game (round '+ld('eco_save',null).r+')</button>':''}<button class="${ld('eco_save',null)?'ln':'go'}" data-t="1">${seen?'Replay tutorial':'Start with tutorial'}</button><button class="ln" data-t="0">Skip tutorial</button></div></div>`;
 document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{window.__b=b.dataset.b;menu()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startGame(window.__b||'home',b.dataset.t=='1'));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const s=ld('eco_save',null);if(!s)return;G=s;T={on:false,step:0};document.body.className='g';talk('Welcome back! Let’s keep going.','happy',1);draw()})}
function draw(){idle=Date.now();const A=document.getElementById('app'),pb=document.getElementById('pipbox'),tu=document.getElementById('tut');
 if(!G)return menu();
 if(G.done){document.body.className='';pb.innerHTML=`<div class="pipbox" style="position:static">${pip('cheer',70,1)}</div>`;tu.innerHTML='';document.getElementById('stats').innerHTML='';
  const s=G.score,rt=s>=100?'Thriving ecosystem':s>=50?'Stable ecosystem':'Fragile ecosystem';
  A.innerHTML=`<div class="end"><h2 class="d" style="font-size:30px;margin:0">${rt}</h2><p>Final score <b>${s}</b> over ${R} rounds. Rounds: ${G.hist.join(', ')}.</p>${G.newU.map(k=>`<p class="d" style="font-size:22px">🎉 New biome unlocked: ${DATA[k].n}!</p>`).join('')}<button class="go" onclick="G=null;draw()">Back to menu</button></div>`;return}
 const r=evalBoard(),sel=G.hand[G.sel],e=G.ev;
 document.getElementById('stats').innerHTML=`<span>Round <b>${G.r}</b>/${R}</span><span>Actions <b>${G.ap}</b></span><span>Score <b>${G.score}</b></span>`;
