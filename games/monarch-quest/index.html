const inb=(x,y)=>x>=0&&y>=0&&x<WW&&y<WH;
function mkNoise(seed){const r=mulberry32(seed),L=new Float32Array(4096);for(let i=0;i<4096;i++)L[i]=r();
  const at=(i,j)=>L[((j&63)<<6)|(i&63)], sm=t=>t*t*(3-2*t);
  return (x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j);return at(i,j)*(1-fx)*(1-fy)+at(i+1,j)*fx*(1-fy)+at(i,j+1)*(1-fx)*fy+at(i+1,j+1)*fx*fy;};}
function genWorld(seed){
  const rnd=mulberry32(seed^0x9e37), n=mkNoise(seed), m=mkNoise(seed+77);
  TER=new Uint8Array(WW*WH); OBJ=new Uint8Array(WW*WH);
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
    const k=y*WW+x, e=n(x*.07,y*.07)*.62+n(x*.15,y*.15)*.3+n(x*.3,y*.3)*.08, mo=.5+m(x*.1,y*.1);
    TER[k]=e<B.w?1:e>B.r?2:0; const r=rnd();
    if(TER[k]===1){ if(B.pw&&r<B.pw)OBJ[k]=2; continue; }
    if(TER[k]===2)continue;
    if(r<B.k)OBJ[k]=1; else if(r<B.k+B.p*mo)OBJ[k]=2; else if(r<B.k+B.p*mo+B.f)OBJ[k]=4;
    else if(r<B.k+B.p*mo+B.f+B.h&&(!B.pw||nearTer(x+.5,y+.5,1,2)))OBJ[k]=7;
  }
  // find a start tile near the middle (water tile for swimmers)
  let sx=WW/2,sy=WH/2,found=false;
  for(let rad=0;rad<40&&!found;rad++)for(let a=0;a<360&&!found;a+=15){const x=Math.floor(WW/2+Math.cos(a)*rad),y=Math.floor(WH/2+Math.sin(a)*rad);
    if(inb(x,y)&&(CH.swim?TER[y*WW+x]===1:TER[y*WW+x]===0&&!OBJ[y*WW+x])){sx=x+.5;sy=y+.5;found=true;}}
  // guarantee basics near the start: food, shelter, water
  const put=(o,cnt,rad,ter)=>{let c=0;for(let i=0;i<400&&c<cnt;i++){const x=Math.floor(sx+(rnd()-.5)*rad*2),y=Math.floor(sy+(rnd()-.5)*rad*2);
    if(inb(x,y)&&TER[y*WW+x]===ter&&!OBJ[y*WW+x]&&Math.hypot(x+.5-sx,y+.5-sy)>1.5){OBJ[y*WW+x]=o;c++;}}};
  put(2,5,9,CH.swim?1:0); put(7,3,10,0); put(4,3,10,0); if(!CH.swim&&B.w<.2)put(6,2,10,0);
  if(CH.swim){put(7,3,12,0);put(4,2,14,0);}
  return {sx,sy};
}
function nearTer(x,y,code,r){for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++)for(let dx=-Math.ceil(r);dx<=Math.ceil(r);dx++){const tx=Math.floor(x)+dx,ty=Math.floor(y)+dy;if(inb(tx,ty)&&TER[ty*WW+tx]===code&&Math.hypot(tx+.5-x,ty+.5-y)<=r)return true;}return false;}
function findObj(x,y,codes,r){let best=-1,bd=r+1;for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++)for(let dx=-Math.ceil(r);dx<=Math.ceil(r);dx++){const tx=Math.floor(x)+dx,ty=Math.floor(y)+dy;if(!inb(tx,ty))continue;const k=ty*WW+tx;if(codes.includes(OBJ[k])){const d=Math.hypot(tx+.5-x,ty+.5-y);if(d<bd){bd=d;best=k;}}}return best;}
// Minecraft-style random ticks: a few random tiles per frame get a chance to change
let rainT=0;
function randomTicks(night){
  for(let i=0;i<28;i++){
    const x=(Math.random()*WW)|0,y=(Math.random()*WH)|0,k=y*WW+x,o=OBJ[k],t=TER[k],r=Math.random();
    if(o===3){ if(r<.25)OBJ[k]=2; }                                           // eaten plants regrow
    else if(o===2){ if(r<.03){const nx=x+((Math.random()*3)|0)-1,ny=y+((Math.random()*3)|0)-1; if(inb(nx,ny)&&TER[ny*WW+nx]===(t)&&!OBJ[ny*WW+nx])OBJ[ny*WW+nx]=2;} } // plants spread
    else if(o===4){ if(night)OBJ[k]=5; }                                      // flowers close at night
    else if(o===5){ if(!night)OBJ[k]=4; }                                     // ...and reopen at dawn
    else if(o===6){ if(!night&&rainT<=0&&r<.25)OBJ[k]=0; }                    // dew evaporates in sunlight
    else if(!o&&t===0&&B.dew&&((night&&r<.012)||(rainT>0&&r<.04)))OBJ[k]=6;   // dew forms on cool nights / rain
  }
}

/* ---------- game state ---------- */
let cutDemo=-1, state='title', time=0, gt=0, menuSel=0, shopSel=0, SEEDSHOW=0;

const clockStr=()=>{const t=(gt/10800)%1,h=(t*24+6)%24,hh=Math.floor(h),mm=Math.floor((h-hh)*60);return(dark()>.5?'🌙 ':'☀️ ')+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');};

function updateCam(snap){const tx=Math.max(0,Math.min(WW*T-W,P.x*T-W/2)),ty=Math.max(0,Math.min(WH*T-H,P.y*T-H/2));if(snap){camX=tx;camY=ty;}else{camX+=(tx-camX)*.12;camY+=(ty-camY)*.12;}}

/* ---------- movement / collision ---------- */
function solidAt(x,y){
  if(!inb(x,y))return true; const k=idx(x,y);
  if(P.st===stagesOf().length-1)return false;                    // adults fly over obstacles
  if(TER[k]===2||OBJ[k]===1)return true;
  if(CH.swim&&sName()==='nymph')return TER[k]!==1;               // nymphs only swim
  return TER[k]===1;                                             // others can't cross water
}
function canStand(x,y){const h=.28;return !(solidAt(x-h,y-h)||solidAt(x+h,y-h)||solidAt(x-h,y+h)||solidAt(x+h,y+h));}
function movePlayer(){
  const sn=sName(); if(sn==='egg'||sn==='pupa'){P.moving=false;return;}
  let dx=(down('arrowright','d')?1:0)-(down('arrowleft','a')?1:0), dy=(down('arrowdown','s')?1:0)-(down('arrowup','w')?1:0);
  P.moving=!!(dx||dy); if(!P.moving)return;
  const m=Math.hypot(dx,dy); dx/=m; dy/=m; P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  const adult=sn==='adult', sprint=down('shift')&&P.food>5, sp=(adult?.085:sn==='nymph'?.05:.042)*(sprint?1.6:1)*(P.hp<30?.8:1);
  if(sprint)P.food=Math.max(0,P.food-.03);
  const nx=P.x+dx*sp, ny=P.y+dy*sp; let moved=0;
  if(canStand(nx,P.y)){P.x=nx;moved+=Math.abs(dx*sp);} if(canStand(P.x,ny)){P.y=ny;moved+=Math.abs(dy*sp);}
  P.x=Math.max(.5,Math.min(WW-.5,P.x)); P.y=Math.max(.5,Math.min(WH-.5,P.y)); P.dist+=moved; if(P.dist>250)ach('far');
  if(moved&&++P.stp%9===0)parts.push({x:P.x,y:P.y+.3,vx:(Math.random()-.5)*.01,vy:-.004,l:16,m:16,c:'rgba(255,255,255,.6)',r:2.5});
}

/* ---------- predators (spawned by random ticks) ---------- */
function allowedPred(night){return CH.pred.concat(night&&!CH.swim?['owl','bat']:[]).filter(t=>{const p=PRED[t];return !(p.day&&night)&&!(p.night&&!night);});}
function spawnTick(night){
  const sn=sName(), cap=2+Math.min(5,P.st*1.5)+(night?1:0)+(sn==='adult'?1:0);
  if(mobs.length>=cap)return;
  const types=allowedPred(night); if(!types.length)return;
  const ty=types[(Math.random()*types.length)|0], pr=PRED[ty];
  for(let tries=0;tries<12;tries++){const a=Math.random()*6.28,d=11+Math.random()*6,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    if(!inb(x,y))continue; const k=idx(x,y); if(pr.water?TER[k]!==1:(!pr.fly&&(TER[k]!==0||OBJ[k]===1)))continue;
    mobs.push({type:ty,x,y,st:'idle',t:0,vx:0,vy:0,stun:0});return;}
}
function mobMove(p,dx,dy){const pr=PRED[p.type];let nx=p.x+dx,ny=p.y+dy;
  if(pr.fly){p.x=nx;p.y=ny;} else{const ok=(x,y)=>inb(x,y)&&(pr.water?TER[idx(x,y)]===1:(TER[idx(x,y)]===0&&OBJ[idx(x,y)]!==1)); if(ok(nx,p.y))p.x=nx;else p.t=0; if(ok(p.x,ny))p.y=ny;else p.t=0;}
  p.x=Math.max(.5,Math.min(WW-.5,p.x));p.y=Math.max(.5,Math.min(WH-.5,p.y));}
function hurt(from,dmg,why){
  if(P.invuln>0)return; P.invuln=80; P.hp-=dmg; burst(P.x,P.y,'#ff5a5a',12,.08,24); shake=7; flash=14; Music.sfx('hurt');
  const dx=P.x-from.x,dy=P.y-from.y,m=Math.hypot(dx,dy)||1; for(let i=0;i<5;i++){const nx=P.x+dx/m*.1,ny=P.y+dy/m*.1;if(canStand(nx,ny)){P.x=nx;P.y=ny;}}
  if(P.hp<=0)die(why);
}
function updateMobs(night){
  const sn=sName(), hiddenDeep=P.inSh, flowerHide=!hiddenDeep&&[4,5].includes(OBJ[idx(P.x,P.y)]), toxic=CH.toxic&&sn!=='egg'&&sn!=='pupa'?1:0;
  for(const p of mobs.slice()){
    const pr=PRED[p.type], dx=P.x-p.x, dy=P.y-p.y, d=Math.hypot(dx,dy)||1, spd=pr.sp;
    if(d>30||(pr.day&&night)||(pr.night&&!night)){mobs.splice(mobs.indexOf(p),1);continue;}
    if(p.stun>0){p.stun--;mobMove(p,-dx/d*spd*1.3,-dy/d*spd*1.3);continue;}
    const range=hiddenDeep?0:flowerHide?1.3:pr.r, sees=d<range;
    if(sees&&!P.seen[p.type]){P.seen[p.type]=1;toast(pr.ic+' '+pr.f,300);}
    if(p.st==='chase'&&!sees&&d>1.5){P.escapes++;p.st='idle';if(P.escapes>=4)ach('escape');}
    if(pr.lunge){ if(p.st==='lunge'){mobMove(p,p.vx,p.vy);p.t--;if(p.t<=0){p.st='idle';p.stun=70;}} else if(sees){p.st='lunge';p.t=14;p.vx=dx/d*.16;p.vy=dy/d*.16;} }
    else if(sees){p.st='chase';let ax=dx/d,ay=dy/d;if(pr.erratic){ax+=Math.sin(time/130+p.x)*.9;ay+=Math.cos(time/110+p.y)*.9;}mobMove(p,ax*spd,ay*spd);}

    if(d<.75&&P.invuln<=0&&!hiddenDeep){
      p.stun=220;
      if(toxic&&(p.type==='bird'||p.type==='frog'||p.type==='owl')&&Math.random()<.6){toast('🧪 The '+p.type+' spat you out. Milkweed toxins (warning colors work!)',240);Music.sfx('clink');p.stun=520;continue;}
      if(sn==='egg'){die('Eaten as an egg by a '+p.type+'. Many eggs never hatch, so parents lay lots of them.');return;}
      hurt(p,32,'Eaten by a '+p.type+'.');
      if(state!=='play')return;
    }
  }
}

/* ---------- survival stats ---------- */
function updateStats(night){
  const sn=sName(), s=1/60, slow=(sn==='egg'||sn==='pupa')?.15:1;
  P.inSh=OBJ[idx(P.x,P.y)]===7;
  if(P.inSh&&!P.sheltered){P.sheltered=1;ach('shelter');}
  const rain=rainT>0, exposed=!P.inSh;
  P.food=Math.max(0,P.food-1.0*s*slow*(sn==='adult'?1.2:1)); P.water=Math.max(0,P.water-1.1*s*slow*(rain?.2:1));
  if(night&&exposed)P.warm-=1.8*s; else if(rain&&exposed)P.warm-=1.1*s; else P.warm+=(P.inSh?1.2:.6)*s; P.warm=Math.max(0,Math.min(100,P.warm));
  if(rain&&P.inSh){P.rainSh+=s;if(P.rainSh>8)ach('rain');}
  let drain=0; if(P.food<=0)drain+=3; if(P.water<=0)drain+=3; if(P.warm<=0)drain+=2.5;
  if(rain&&exposed&&(sn==='egg'||sn==='pupa'))drain+=6;
  if(drain)P.hp-=drain*s; else if(P.food>40&&P.water>40&&P.warm>30&&P.hp<100)P.hp=Math.min(100,P.hp+1.2*s);
  if(P.hp<=0){die(P.food<=0?'Starved. Insects must eat constantly to power their tiny bodies.':P.water<=0?'Died of thirst. Dew drops and puddles are lifelines.':rain&&exposed?'Washed out by the storm. Shelter protects from rain.':'Died of cold. Insects need warmth to stay active.');}
  if(night&&!lastNight)lastNight=true; if(!night&&lastNight&&P.age>60*40){lastNight=false;ach('night');}
}

/* ---------- life cycle ---------- */
function stageFact(n){const f=FACTS[n]||FACTS.any;return f[(Math.random()*f.length)|0];}
function toStage(i){
  P.st=i; P.stT=0; P.growth=0; P.ready=false; const n=sName(); mobs=mobs.filter(m=>false); burst(P.x,P.y,'#ffe27a',24,.1,40,3);
  if(n==='larva'||n==='nymph'){P.inst=1;}
  if(n==='adult'){ach('adult');P.warm=Math.max(P.warm,70);Music.sfx('bossdead');}
  cut(n==='larva'||n==='nymph'?'hatch':n==='pupa'?'pupa':n==='adult'?'emerge':null);
}
function eatAction(){
  const sn=sName(), codes=sn==='adult'?(CH.aEat==='F'?[4]:[2]):[2], k=findObj(P.x,P.y,codes,1.25);
  if(k<0)return false; const o=OBJ[k];
  if(o===4){
    OBJ[k]=4; P.food=Math.min(100,P.food+14); P.water=Math.min(100,P.water+10); burst(P.x,P.y,'#ffd84a',8,.05,20); Music.sfx('heart'); ach('bite');
    const fx=k%WW+.5, fy=Math.floor(k/WW)+.5;
    if(!P.pollen)P.pollen={x:fx,y:fy};
    else if(Math.hypot(fx-P.pollen.x,fy-P.pollen.y)>=6){P.pollinated++;ach('pollen');toast('🌼 Pollination! Pollen from far away makes seeds. New plants sprout nearby.',260);
      for(let i=0;i<6;i++){const nx=Math.floor(fx)+((Math.random()*5)|0)-2,ny=Math.floor(fy)+((Math.random()*5)|0)-2;if(inb(nx,ny)&&TER[ny*WW+nx]===0&&!OBJ[ny*WW+nx])OBJ[ny*WW+nx]=2;} P.pollen=null;}
    else toast('🌼 You picked up pollen. Visit a flower far away to pollinate it!',160);
    return true;
  }
  OBJ[k]=3; P.food=Math.min(100,P.food+26); if(sn!=='adult')P.growth=Math.min(100,P.growth+15+P.inst*0); burst(P.x,P.y,'#9be36a',10,.06,22); Music.sfx('key'); ach('bite');
  if(sn!=='adult'&&P.growth>=100&&!P.ready){P.ready=true;toast(P.inst>=CH.inst?'🌿 Fully grown! Find a shelter and press E.':'🌿 Time to molt! Find a shelter and press E.',260);}
  return true;
}
function drinkAction(){
  const k=findObj(P.x,P.y,[6],1.1);
  if(k>=0){OBJ[k]=0;P.water=Math.min(100,P.water+30);burst(P.x,P.y,'#bfe8ff',10,.05,24);Music.sfx('dew');ach('drink');return true;}
  if(nearTer(P.x,P.y,1,1.5)){P.water=Math.min(100,P.water+2.2);if(!P.drank){P.drank=1;ach('drink');}if(time%12<1)Music.sfx('dew');return true;}
  return false;
}
function layOk(){
  const k=idx(P.x,P.y);
  if(CH.lay==='P')return findObj(P.x,P.y,[2],1.2)>=0; if(CH.lay==='H')return OBJ[k]===7; if(CH.lay==='W')return nearTer(P.x,P.y,1,1.6); return TER[k]===0&&!OBJ[k];
}
function interact(){
  const sn=sName();
  if(sn==='egg')return;
  if(sn==='pupa')return;
  if(P.ready&&P.inSh&&(sn==='larva'||sn==='nymph')){startMolt();return;}
  if(sn==='adult'&&mate&&Math.hypot(mate.x-P.x,mate.y-P.y)<2.2&&!P.mated){startDance();return;}
  if(sn==='adult'&&P.mated&&!P.laid&&layOk()){
    P.laid=true;P.eggs=20+((Math.random()*30)|0);ach('eggs');burst(P.x,P.y,'#fff',24,.08,40,3);Music.sfx('container');
    say(['🥚 You laid '+P.eggs+' eggs on '+CH.layTxt+'! Your legacy lives on.','Many will be eaten, but a few will survive to start the cycle again. You may rest now.']);return;}
  if(eatAction())return; if(drinkAction())return;
  toast(P.ready?'Find a shelter (a dark hollow) first.':sn==='adult'?'Nothing to use here. Look for '+CH.aFood+'.':'Nothing to eat here. Look for '+CH.food+'.',100);
}
function startMolt(){
  const final=P.inst>=CH.inst; mini={t:'molt',pos:0,dir:1,z:[.38+Math.random()*.2,0],ph:'run',tm:0,final}; mini.z[1]=mini.z[0]+.22; Music.sfx('warn');
}
function finishMolt(res){
  const final=mini.final; mini=null;
  if(res==='perfect')ach('perfect'); else {P.hp-=12;toast('A rough molt hurt a little. Timing matters!',150);if(P.hp<=0){die('Injured during a molt.');return;}}
  burst(P.x,P.y,'#fff',22,.09,36,3);
  if(!final){P.inst++;P.molts++;P.growth=0;P.ready=false;ach('molt');Music.sfx('container');cut('molt');say(['🧬 Molt complete! You are now instar '+P.inst+'/'+CH.inst+'.',stageFact(sName())]);return;}
  P.molts++;ach('molt');ach('pupa');
  if(CH.cyc==='complete'){toStage(2);say(['🛡️ You formed a chrysalis! Inside, your body is being rebuilt.',stageFact('pupa')]);}
  else{toStage(2);say(['🦟 Your final molt is done. Wings dry and harden: you are an adult!',stageFact('adult'),'Now eat, find a mate, and lay eggs before your time runs out.']);}
}
function startDance(){mini={t:'dance',seq:Array.from({length:4},()=>['up','down','left','right'][(Math.random()*4)|0]),ph:'show',tm:0,inp:0};}
function updateMini(){
  if(tap('escape')){if(mini.t==='dance')mini=null;return;}
  const m=mini; m.tm++;
  if(m.t==='molt'){
    if(m.ph==='run'){m.pos+=m.dir*.022;if(m.pos>=1){m.pos=1;m.dir=-1;}if(m.pos<=0){m.pos=0;m.dir=1;}

    else if(m.tm>50)finishMolt(m.res);
  } else {
    if(m.ph==='show'){if(m.tm%34===1)Music.sfx('talk');if(m.tm>=34*4+20){m.ph='input';m.tm=0;m.inp=0;}}
    else if(m.ph==='input'){const k=(tap('arrowup')||tap('w'))?'up':(tap('arrowdown')||tap('s'))?'down':(tap('arrowleft')||tap('a'))?'left':(tap('arrowright')||tap('d'))?'right':null;
      if(k){if(k===m.seq[m.inp]){m.inp++;Music.sfx('dew');if(m.inp>=4){m.ph='win';m.tm=0;Music.sfx('heart');}}else{m.ph='fail';m.tm=0;Music.sfx('hurt');}}}
    else if(m.ph==='fail'){if(m.tm>60){m.ph='show';m.tm=0;}}
    else if(m.ph==='win'&&m.tm>55){mini=null;P.mated=true;mate=null;ach('mate');say(['💞 Your courtship dance worked!','Now find '+CH.layTxt+' and press E to lay your eggs.']);}
  }
}

/* ---------- main update ---------- */
function update(){
  time+=1000/60;
  if(state==='cut')return;
  if(state==='title'){
    if(!Music.ready){if(taps.size)Music.start();}
    else{ if(tap('arrowup')||tap('w'))menuSel=(menuSel+2)%3; if(tap('arrowdown')||tap('s'))menuSel=(menuSel+1)%3;
      if(tap('m'))Music.toggle(); if(tap('c')){cutDemo=(cutDemo+1)%4;cut(['hatch','molt','pupa','emerge'][cutDemo]);return;} if(tap(' ')||tap('enter')){ if(menuSel===0)startRun(); else if(menuSel===1){state='shop';shopSel=0;} else state='badges'; } }
  } else if(state==='shop'){
    const ids=Object.keys(CHARS); if(tap('arrowup')||tap('w'))shopSel=(shopSel+ids.length-1)%ids.length; if(tap('arrowdown')||tap('s'))shopSel=(shopSel+1)%ids.length;
    if(tap('escape'))state='title';
    if(tap(' ')||tap('enter')){const id=ids[shopSel],c=CHARS[id]; if(SAVE.owned[id])SAVE.sel=id; else if(SAVE.pts>=c.cost){SAVE.pts-=c.cost;SAVE.owned[id]=1;SAVE.sel=id;Music.sfx('container');} else Music.sfx('hurt'); persist();}
  } else if(state==='badges'){ if(tap('escape')||tap(' ')||tap('enter'))state='title'; }
  else if(state==='summary'){ if(tap(' ')||tap('enter')||tap('escape'))state='title'; }
  else if(state==='play'){
    if(dialog){if(tap(' ')||tap('enter')||tap('e')){Music.sfx('talk');dialog.i++;if(dialog.i>=dialog.lines.length){const cb=dialog.cb;dialog=null;if(cb)cb();}}}
    else if(mini)updateMini();
    else playStep();
    if(toasts.length){toasts[0].t--;if(toasts[0].t<=0)toasts.shift();}
    for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.l--;} parts=parts.filter(q=>q.l>0);
    if(parts.length<70&&Math.random()<.1){const nt=dark()>.4;parts.push({x:camX/T+Math.random()*21,y:camY/T+Math.random()*16,vx:.005,vy:-.003,l:300,m:300,c:nt?'#e8ff8a':'#fff3b0',r:nt?2.2:1.6,amb:1});}
    if(rainT>0)for(let i=0;i<3;i++)parts.push({x:camX/T+Math.random()*21,y:camY/T-1,vx:-.02,vy:.3,l:40,m:40,c:'#bfe0ff',r:1.2,amb:1});
    if(shake>0){shake*=.86;if(shake<.3)shake=0;} if(flash>0)flash--;
    updateCam();
  }
  if(tap('m')&&state!=='title')Music.toggle();
  Music.track(wantTrack());
  taps.clear();
}
function playStep(){
  gt++; P.age++; P.stT++; if(P.invuln>0)P.invuln--;
  const night=dark()>.5, sn=sName();
  randomTicks(night);
  if(gt%90===0)spawnTick(night);
  if(gt>5400&&rainT<=0&&Math.random()<.0004){rainT=60*25;toast('🌧️ A rainstorm rolls in! Seek shelter. Rain also fills dew drops.',300);}
  if(rainT>0)rainT--;
  // stage logic
  if(sn==='egg'){
    if(P.stT>600){ if(tap(' ')||tap('e')){P.hatch+=.1;Music.sfx('key');shake=2;} P.hatch=Math.max(0,P.hatch-.0012);
      if(P.hatch>=1){ach('hatch');toStage(1);P.food=80;P.water=80;say(['🐣 You hatched! You chewed through the shell and ate part of it.',stageFact(sName()),'Eat '+CH.food+' (press E) to grow. Find shelter for each molt.']);return;} }
  } else if(sn==='pupa'){
    if(P.stT%720===360)toast('🛡️ '+stageFact('pupa'),340);
    if(P.stT>2400){toStage(3);say(['🦋 You emerged as an adult '+CH.name+'!',stageFact('adult'),'You have limited time: eat, find a mate, and lay eggs.']);return;}
  } else if(sn==='adult'){
    if(!mate&&!P.mated&&P.stT>60*22){ for(let i=0;i<30;i++){const a=Math.random()*6.28,d=16+Math.random()*10,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d; if(inb(x,y)){mate={x,y,vx:0,vy:0,t:0};break;}} if(mate)toast('💞 A potential mate is nearby! Follow the pink arrow.',260); }
    if(mate){mate.t--;if(mate.t<=0){mate.t=80;const r=Math.random()*6.28;mate.vx=Math.cos(r)*.02;mate.vy=Math.sin(r)*.02;} mate.x=Math.max(1,Math.min(WW-1,mate.x+mate.vx));mate.y=Math.max(1,Math.min(WH-1,mate.y+mate.vy));}
    if(P.stT>CH.life*60){die(P.laid?'Died peacefully of old age after laying eggs. This is the natural end of an adult insect\'s life.':'Died of old age. Adult insects live briefly; their main job is to reproduce.',true);return;}
    if(P.laid&&P.stT%1200===600)toast('🍃 You can rest now. Adults live only days to weeks.',200);
  }
  movePlayer();
  if(tap('e')||tap(' '))interact();
  for(const s of scrolls.slice()){ if(Math.hypot(s.x-P.x,s.y-P.y)<.8){scrolls.splice(scrolls.indexOf(s),1);P.facts++;Music.sfx('key');say(['📜 Field Guide: '+stageFact(Math.random()<.5?sName():'any')]);if(P.facts>=4)ach('facts');break;} }
  updateStats(night); if(state!=='play')return;
  updateMobs(night); if(state!=='play')return;
  P.hidden=P.inSh||[4,5].includes(OBJ[idx(P.x,P.y)]);
  hint=makeHint();
}
function makeHint(){
  const sn=sName(); if(sn==='egg')return P.stT<600?'🥚 Developing... stay warm and hidden ('+Math.ceil((600-P.stT)/60)+'s)':'🐣 Mash SPACE to chew out of your egg!';
  if(sn==='pupa')return '🛡️ Metamorphosis in progress... '+Math.floor(P.stT/24)+'%';
  if(P.water<28)return '💧 Thirsty! Stand by water or a dew drop and press E.';
  if(P.food<28)return '🍃 Hungry! Press E next to '+(sn==='adult'?CH.aFood:CH.food)+'.';
  if(P.warm<30)return '🌡️ Cold! Get into a shelter (dark hollow).';
  if(sn==='larva'||sn==='nymph')return P.ready?'🏠 Find a shelter and press E to '+(P.inst>=CH.inst?(CH.cyc==='complete'?'form your chrysalis':'molt into an adult'):'molt')+'.':'🍃 Eat '+CH.food+' to grow ('+Math.floor(P.growth)+'%)';
  if(mate&&!P.mated)return '💞 Find your mate and press E to start the courtship dance.';
  if(P.mated&&!P.laid)return '🥚 Press E on '+CH.layTxt+' to lay your eggs.';
  return P.laid?'🌅 Rest and enjoy your last days. ('+Math.max(0,Math.ceil((CH.life*60-P.stT)/60))+'s left)':'🌼 Eat '+CH.aFood+', pollinate flowers, wait for a mate. ('+Math.max(0,Math.ceil((CH.life*60-P.stT)/60))+'s left)';
}
function wantTrack(){
  if(state!=='play')return state==='summary'?'sad':'title';
  if(mobs.some(m=>m.st==='chase'||m.st==='lunge'))return 'boss';
  if(dark()>.6)return 'lake'; return CH.music;

  drawWorld();
  scrolls.forEach(s=>{const x=s.x*T-camX,y=s.y*T-camY+Math.sin(time/250+s.x)*3;if(x>-20&&x<W+20&&y>-20&&y<H+20){ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('📜',x,y);ctx.textBaseline='alphabetic';}});
  if(mate){const x=mate.x*T-camX,y=mate.y*T-camY;ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(CH.ic,x,y+Math.sin(time/200)*3);ctx.fillText('💕',x,y-26);ctx.textBaseline='alphabetic';
    if(x<0||x>W||y<0||y>H){const a=Math.atan2(mate.y-P.y,mate.x-P.x),ax=W/2+Math.cos(a)*220,ay=H/2+Math.sin(a)*160;ctx.save();ctx.translate(Math.max(20,Math.min(W-20,ax)),Math.max(20,Math.min(H-20,ay)));ctx.rotate(a);ctx.fillStyle='#ff6fb0';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.fill();ctx.restore();}}
  drawMobs(); drawPlayer();
  for(const q of parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.l/(q.m*.45)))*(q.amb?.6:1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x*T-camX,q.y*T-camY,q.r*(q.amb?1:.4+q.l/q.m),0,7);ctx.fill();}ctx.globalAlpha=1;
  drawNight();
  const g=ctx.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.9);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,10,50,.3)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(flash>0){ctx.fillStyle='rgba(255,40,40,'+(flash/14*.28)+')';ctx.fillRect(0,0,W,H);}
  drawBars();
  if(hint){ctx.font='14px Arial';const tw=Math.min(W-20,ctx.measureText(hint).width+30);ctx.fillStyle='rgba(10,12,20,.7)';ctx.fillRect(W/2-tw/2,H-46,tw,28);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(hint,W/2,H-27);}
  if(toasts.length){const t=toasts[0];ctx.font='14px Arial';const tw=Math.min(W-20,ctx.measureText(t.text).width+30);ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(W/2-tw/2,70,tw,30);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(t.text,W/2,90);}
  if(dialog){box(30,H-150,W-60,120);ctx.fillStyle='#3a2a14';ctx.font='16px Arial';ctx.textAlign='left';const words=dialog.lines[dialog.i].split(' ');let line='',y=H-118;for(const w of words){if(ctx.measureText(line+w).width>W-110){ctx.fillText(line,50,y);y+=22;line='';}line+=w+' ';}ctx.fillText(line,50,y);ctx.fillStyle='#c0560a';ctx.fillText('▼ SPACE',W-130,H-42);}
  if(mini)drawMini();
}
function drawMini(){
  ctx.fillStyle='rgba(10,6,24,.72)';ctx.fillRect(0,0,W,H);box(80,90,W-160,300);ctx.textAlign='center';ctx.fillStyle='#3a2a14';
  if(mini.t==='molt'){
    ctx.font='bold 22px Arial';ctx.fillText('🧬 Molting!',W/2,135);ctx.font='15px Arial';ctx.fillText('Press SPACE when the marker is in the green zone',W/2,162);ctx.fillText('to shed your old skin cleanly.',W/2,182);
    ctx.fillStyle='#ddd2b0';ctx.fillRect(130,230,380,36);ctx.fillStyle='#5cc050';ctx.fillRect(130+380*mini.z[0],230,380*(mini.z[1]-mini.z[0]),36);
    ctx.fillStyle='#3a2a14';ctx.fillRect(130+380*mini.pos-3,222,6,52);
    if(mini.ph==='done'){ctx.font='bold 20px Arial';ctx.fillStyle=mini.res==='perfect'?'#2f8a1a':'#c0560a';ctx.fillText(mini.res==='perfect'?'Perfect molt!':'Rough molt...',W/2,320);}
  } else {
    ctx.font='bold 22px Arial';ctx.fillText('💞 Courtship Dance',W/2,135);ctx.font='16px Arial';ctx.fillText(mini.ph==='show'?'Watch the dance...':mini.ph==='input'?'Now copy it with the arrow keys!':mini.ph==='fail'?'Oops! Watch again...':'They loved it!',W/2,165);
    const AR={up:'↑',down:'↓',left:'←',right:'→'};if(mini.ph==='show'){const i=Math.floor(mini.tm/34);if(i<4&&mini.tm%34<26){ctx.font='bold 110px Arial';ctx.fillStyle='#e07a10';ctx.fillText(AR[mini.seq[i]],W/2,280);}}
    for(let i=0;i<4;i++){ctx.fillStyle=(mini.ph==='win'||(mini.ph==='input'&&i<mini.inp))?'#4ca832':'#c9b98a';ctx.beginPath();ctx.arc(W/2+(i-1.5)*34,340,10,0,7);ctx.fill();}
  }
}
function drawTitle(){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2b1b4a');gr.addColorStop(.55,'#c8546a');gr.addColorStop(1,'#f5a44a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(hash(i,1)*.64,hash(i,2)*.3,2,2);}
  ctx.fillStyle='#1d3a2a';ctx.fillRect(0,360,W,120);ctx.fillStyle='#2c5a3a';ctx.fillRect(0,360,W,8);
  ctx.font='60px Arial';ctx.textAlign='center';ctx.fillText(CHARS[SAVE.sel].ic,W/2+Math.sin(time/500)*110,120+Math.cos(time/350)*12);
  center('TINY LIVES',185,'bold 50px Arial','#ffb347');center('A Monarch Quest survival adventure · ver. 3.0',215,'15px Arial','#fff');
  center('⭐ '+SAVE.pts+' points   ·   Best life: '+SAVE.best+'s   ·   Runs: '+SAVE.runs,246,'14px Arial','#ffe9a0');
  if(!Music.ready){if(Math.floor(time/500)%2)center('PRESS ANY KEY',360,'bold 22px Arial','#ffd84a');return;}
  ['▶ Play as '+CHARS[SAVE.sel].name+'  ('+CHARS[SAVE.sel].set+')','🛒 Shop: new characters & settings','🏅 Badges ('+Object.keys(SAVE.badges).length+'/'+ACH.length+')'].forEach((t,i)=>center((menuSel===i?'➤ ':'   ')+t,300+i*34,'bold 19px Arial',menuSel===i?'#ffd84a':'#ddd'));
  center('↑/↓ choose · SPACE select · M music · Every life ends. Learn as much as you can!',460,'12px Arial','#e8d8f0');
}
function drawShop(){
  ctx.fillStyle='#1c1630';ctx.fillRect(0,0,W,H);center('🛒 SHOP',44,'bold 30px Arial','#ffb347');center('⭐ '+SAVE.pts+' points to spend',70,'15px Arial','#ffe9a0');
  Object.keys(CHARS).forEach((id,i)=>{const c=CHARS[id],sel=shopSel===i,y=92+i*70;box(60,y,W-120,62,sel?'rgba(255,243,209,.96)':'rgba(0,0,0,.45)',sel?'#e07a10':'#555');
    ctx.textAlign='left';ctx.fillStyle=sel?'#3a2a14':'#ddd';ctx.font='bold 17px Arial';ctx.fillText(c.ic+' '+c.name+'  ·  '+c.set,80,y+25);ctx.font='13px Arial';ctx.fillText(c.desc,80,y+47);
    ctx.textAlign='right';ctx.font='bold 15px Arial';ctx.fillStyle=SAVE.sel===id?'#2f8a1a':SAVE.owned[id]?(sel?'#3a2a14':'#9be36a'):(SAVE.pts>=c.cost?'#c0560a':'#888');ctx.fillText(SAVE.sel===id?'✔ SELECTED':SAVE.owned[id]?'OWNED (SPACE: select)':'⭐ '+c.cost+' (SPACE: buy)',W-80,y+25);});
  center('↑/↓ browse · SPACE buy / select · ESC back',H-16,'13px Arial','#aaa');
}
function drawBadges(){
  ctx.fillStyle='#1c1630';ctx.fillRect(0,0,W,H);center('🏅 BADGES',40,'bold 28px Arial','#ffb347');
  ACH.forEach((a,i)=>{const col=i%2,row=Math.floor(i/2),x=30+col*305,y=62+row*46,got=SAVE.badges[a[0]];ctx.fillStyle=got?'rgba(255,243,209,.95)':'rgba(255,255,255,.08)';ctx.fillRect(x,y,295,40);
    ctx.textAlign='left';ctx.font='22px Arial';ctx.fillStyle=got?'#000':'#555';ctx.globalAlpha=got?1:.4;ctx.fillText(a[1],x+6,y+28);ctx.globalAlpha=1;ctx.font='bold 13px Arial';ctx.fillStyle=got?'#3a2a14':'#999';ctx.fillText(a[2]+'  (+'+a[4]+')',x+40,y+17);ctx.font='11px Arial';ctx.fillText(a[3],x+40,y+33);});
  center('SPACE / ESC back',H-12,'13px Arial','#aaa');
}
function drawSummary(){
  ctx.fillStyle='#2a1420';ctx.fillRect(0,0,W,H);center('💀 YOUR LIFE HAS ENDED',50,'bold 32px Arial','#ff7a7a');
  const s=summary; ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='15px Arial';
  const words=s.cause.split(' ');let line='',y=84;for(const w of words){if(ctx.measureText(line+w).width>520){ctx.fillText(line,W/2,y);y+=20;line='';}line+=w+' ';}ctx.fillText(line,W/2,y);
  ctx.fillStyle='#ffe9a0';ctx.font='14px Arial';ctx.fillText('You lived '+s.secs+'s as a '+CH.name+' and reached the '+s.stage+' stage.'+(s.eggs?'  You laid '+s.eggs+' eggs.':''),W/2,y+30);
  ctx.textAlign='left';ctx.font='13px Arial';ctx.fillStyle='#fff';let yy=y+62;ctx.fillText('Badges this run:',60,yy);yy+=20;
  const names=s.earned.map(id=>ACH.find(a=>a[0]===id)).filter(Boolean);
  names.slice(0,8).forEach((a,i)=>{ctx.fillText(a[1]+' '+a[2],70+(i%2)*260,yy+Math.floor(i/2)*20);});if(!names.length)ctx.fillText('None this time. Try eating, hiding and molting!',70,yy);
  const by=Math.max(yy+Math.ceil(Math.max(names.length,1)/2)*20+12,300);
  ctx.fillStyle='#ffd84a';ctx.font='15px Arial';ctx.fillText('Badge points: +'+s.ach_pts+'    Time bonus: +'+s.bonusTime+'    Stage bonus: +'+s.stageBonus,60,by);
  ctx.font='bold 22px Arial';ctx.fillText('Total earned: +'+s.total+' ⭐   (Bank: '+SAVE.pts+')',60,by+32);
  center('SPACE: back to title · spend points in the 🛒 Shop for new characters!',H-20,'14px Arial','#ffe9a0');
}
function render(){
  ctx.save();ctx.textBaseline='alphabetic';if(shake>0&&state==='play')ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  if(state==='title')drawTitle();else if(state==='shop')drawShop();else if(state==='badges')drawBadges();else if(state==='summary')drawSummary();else drawGame();
  ctx.restore();
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(now-last,100);last=now;while(acc>=1000/60){update();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__dbg={get:()=>state==='play'||state==='summary'?({state,x:P.x,y:P.y,st:sName(),hp:P.hp,food:P.food,water:P.water,warm:P.warm,inst:P.inst,growth:P.growth,age:P.age,pts:P.pts,got:Object.keys(P.got),ready:P.ready,inSh:P.inSh,mobs:mobs.length,summary}):({state}),
  sim:(n)=>{for(let i=0;i<n;i++)update();},set:(o)=>Object.assign(P,o),save:()=>SAVE,setSave:(o)=>{Object.assign(SAVE,o);},
  tile:(x,y)=>[TER[idx(x,y)],OBJ[idx(x,y)]],setObj:(x,y,v)=>{OBJ[idx(x,y)]=v;},press:(k)=>{taps.add(k);},hold:(k,on)=>{on?keysDown.add(k):keysDown.delete(k);},
  world:()=>{let c={};for(let i=0;i<TER.length;i++){const k=TER[i]+'/'+OBJ[i];c[k]=(c[k]||0)+1;}return {seed:SEED,c,scrolls:scrolls.length};},
  dialog:()=>!!dialog,mini:()=>mini&&{t:mini.t,ph:mini.ph,seq:mini.seq,pos:mini.pos,z:mini.z,inp:mini.inp},clearMobs:()=>{mobs=[];},mateAt:()=>mate&&[mate.x,mate.y],near:(o)=>findObj(P.x,P.y,[o],12),goto:(k)=>{P.x=k%WW+.5;P.y=Math.floor(k/WW)+.5;},die:(c)=>die(c||'test'),startRun,rain:()=>{rainT=600;}};
})();
</script>
