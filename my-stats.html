<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Stats — DCI Arcade</title>
<style>
  :root {
    --bg: #0b2016;
    --card-bg: #10301f;
    --text: #f3f6f2;
    --muted: #a9c2ae;
    --accent: #d62f2f;
    --gold: #e8b64a;
    --border: #1e4a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 32px 24px 8px;
    text-align: center;
  }
  header a.back {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  header a.back:hover { color: var(--text); }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  #handle-line {
    color: var(--muted);
    margin: 0 0 16px;
  }
  #handle-line strong { color: var(--text); }
  .points-hero {
    max-width: 640px;
    margin: 0 auto 28px;
    padding: 0 24px;
  }
  .points-card {
    background: linear-gradient(135deg, #10301f, #163b25);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .points-card .value {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }
  .points-card .label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .points-chip {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--gold);
    background: rgba(224, 185, 79, 0.12);
    border: 1px solid rgba(224, 185, 79, 0.3);
    border-radius: 6px;
    padding: 2px 8px;
    margin-top: 4px;
    display: inline-block;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .row .left h3 {
    margin: 0 0 4px;
    font-size: 1.05rem;
  }
  .row .left .score {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .row .right {
    text-align: right;
  }
  .row .rank {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .row .rank.gold { color: var(--gold); }
  .row .of {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 24px;
  }
  .empty a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <a class="back" href="./">&larr; Back to Arcade</a>
  <h1>📊 My Stats</h1>
  <p id="handle-line">Loading…</p>
  <p style="margin-top:4px;"><a href="leaderboard.html" style="color:var(--gold);text-decoration:none;font-weight:700;font-size:0.9rem;">🏆 Hall of Fame</a> &nbsp;·&nbsp; <a href="about.html" style="color:var(--gold);text-decoration:none;font-weight:700;font-size:0.9rem;">🔥 About</a></p>
</header>

<div class="points-hero">
  <div class="points-card">
    <div class="value" id="total-points">—</div>
    <div class="label">Arcade Rating</div>
    <div style="font-size:0.72rem;color:var(--muted);margin-top:6px;">Your average score per game — play well, not just a lot.</div>
    <button id="share-rating-btn" style="margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:9px 20px;font-size:0.85rem;font-weight:700;cursor:pointer;">📤 Share my rating</button>
  </div>
</div>

<div class="wrap" id="stats-list">
  <p class="empty">Loading your games…</p>
</div>

<script type="module">
  import "./shared/lab-sdk.js";

  // lab-sdk.js attaches itself to window.LabSDK once its module runs.
  // Give it a tick to finish auth bootstrap before calling in.
  async function waitForSDK() {
    while (!window.LabSDK) {
      await new Promise(r => setTimeout(r, 50));
    }
  }

  function medalClass(rank) {
    return rank === 1 ? "gold" : "";
  }

  async function render() {
    await waitForSDK();

    const handle = await LabSDK.getHandle();
    document.getElementById("handle-line").innerHTML =
      `Playing as <strong>${handle}</strong>`;

    const { rating, breakdown } = await LabSDK.getArcadePoints();
    document.getElementById("total-points").textContent = rating;

    document.getElementById("share-rating-btn").addEventListener("click", async () => {
      const text = `My Arcade Rating on DCI Arcade is ${rating}. Think you can beat it?`;
      const url = window.location.origin + window.location.pathname.replace("my-stats.html", "");
      const btn = document.getElementById("share-rating-btn");
      try {
        if (navigator.share) {
          await navigator.share({ title: "DCI Arcade", text, url });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(`${text} ${url}`);
          btn.textContent = "Copied! ✅";
          setTimeout(() => { btn.textContent = "📤 Share my rating"; }, 1800);
        }
      } catch (e) { /* share sheet cancelled, ignore */ }
    });

    const stats = await LabSDK.getMyStats();
    const list = document.getElementById("stats-list");

    if (stats.length === 0) {
      list.innerHTML = `
        <p class="empty">
          You haven't played any games yet.<br />
          <a href="./">Browse the arcade</a> to get started.
        </p>`;
      return;
    }

    // Merge points into each stat row, best rank first
    const pointsByGame = Object.fromEntries(breakdown.map(b => [b.game_id, b.points]));
    stats.sort((a, b) => a.rank - b.rank);

    list.innerHTML = stats.map(s => `
      <div class="row">
        <div class="left">
          <h3>${s.game_id}</h3>
          <div class="score">Best score: ${s.best_score}</div>
          <div class="points-chip">+${pointsByGame[s.game_id]} pts</div>
        </div>
        <div class="right">
          <div class="rank ${medalClass(s.rank)}">#${s.rank}</div>
          <div class="of">of ${s.total_players}</div>
        </div>
      </div>
    `).join("");
  }

  render().catch(err => {
    console.error("Failed to load stats", err);
    document.getElementById("stats-list").innerHTML =
      `<p class="empty">Couldn't load your stats. Try refreshing.</p>`;
  });
</script>

</body>
</html>
