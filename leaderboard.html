<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboards — DCI Arcade</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --text: #f2f2f2;
    --muted: #9aa0ab;
    --accent: #2d6cdf;
    --gold: #e0b94f;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 32px 24px 8px;
    text-align: center;
  }
  header a.back {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  header a.back:hover { color: var(--text); }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { color: var(--muted); margin: 0 0 24px; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  .section-title {
    font-size: 1.15rem;
    font-weight: 800;
    margin: 36px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }
  .section-title:first-of-type { margin-top: 0; }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .row .rank {
    font-weight: 800;
    font-size: 1.1rem;
    min-width: 28px;
    color: var(--muted);
    text-align: center;
  }
  .row.gold .rank { color: var(--gold); }
  .row .handle {
    flex: 1;
    font-weight: 700;
  }
  .row .detail {
    color: var(--muted);
    font-size: 0.82rem;
  }
  .row .value {
    font-weight: 800;
    color: var(--gold);
    white-space: nowrap;
  }

  .game-block {
    margin-bottom: 28px;
  }
  .game-block h3 {
    font-size: 1rem;
    margin: 0 0 8px;
    color: var(--text);
  }
  .game-block .row { padding: 8px 14px; }
  .game-block .row .rank { font-size: 0.95rem; min-width: 22px; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: 0.9rem;
  }
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 40px;
  }
</style>
</head>
<body>

<header>
  <a class="back" href="./">&larr; Back to Arcade</a>
  <h1>🏆 Leaderboards</h1>
  <p>See how you stack up — overall and game by game.</p>
</header>

<div class="wrap">
  <div class="section-title">Overall Arcade Points</div>
  <div id="global-board"><p class="loading">Loading…</p></div>

  <div class="section-title">By Game</div>
  <div id="per-game-boards"><p class="loading">Loading…</p></div>
</div>

<script type="module">
  import "./shared/lab-sdk.js";

  async function waitForSDK() {
    while (!window.LabSDK) {
      await new Promise(r => setTimeout(r, 50));
    }
  }

  function medalClass(rank) {
    return rank <= 3 ? "gold" : "";
  }

  async function renderGlobal() {
    const top = await LabSDK.getGlobalLeaderboard(20);
    const el = document.getElementById("global-board");
    if (top.length === 0) {
      el.innerHTML = `<p class="empty">No scores yet — be the first to play!</p>`;
      return;
    }
    el.innerHTML = top.map((p, i) => `
      <div class="row ${medalClass(i+1)}">
        <div class="rank">#${i+1}</div>
        <div class="handle">${p.handle}<div class="detail">${p.games_played} game${p.games_played === 1 ? "" : "s"} played</div></div>
        <div class="value">${p.total_points} pts</div>
      </div>
    `).join("");
  }

  async function renderPerGame() {
    const res = await fetch("catalog/games.json");
    const games = (await res.json()).filter(g => g.status === "live");
    const container = document.getElementById("per-game-boards");

    if (games.length === 0) {
      container.innerHTML = `<p class="empty">No games published yet.</p>`;
      return;
    }

    container.innerHTML = "";
    for (const game of games) {
      const board = await LabSDK.getGameLeaderboard(game.slug, 5);
      const block = document.createElement("div");
      block.className = "game-block";
      if (board.length === 0) {
        block.innerHTML = `<h3>${game.title}</h3><p class="empty">No plays yet.</p>`;
      } else {
        block.innerHTML = `<h3>${game.title}</h3>` + board.map((p, i) => `
          <div class="row ${medalClass(i+1)}">
            <div class="rank">#${i+1}</div>
            <div class="handle">${p.handle}</div>
            <div class="value">${p.best_score}</div>
          </div>
        `).join("");
      }
      container.appendChild(block);
    }
  }

  async function init() {
    await waitForSDK();
    await Promise.all([renderGlobal(), renderPerGame()]);
  }

  init().catch(err => {
    console.error("Failed to load leaderboards", err);
    document.getElementById("global-board").innerHTML = `<p class="empty">Couldn't load leaderboards. Try refreshing.</p>`;
    document.getElementById("per-game-boards").innerHTML = "";
  });
</script>

</body>
</html>
